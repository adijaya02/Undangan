<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#28372d" id="metaThemeColor">
  <title>Undangan Pernikahan — Raka &amp; Sari</title>

  <!-- Google Fonts untuk tampilan tipografi pernikahan yang elegan -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Great+Vibes&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    :root {
      --font-script: 'Great Vibes', cursive;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px 18px;
      position: relative;
      isolation: isolate;
      overflow-x: hidden;

      font-family: var(--font-sans);
      color: #ffffff;
      text-align: center;
      background: #28372d;
    }

    /* Dua lapisan foto untuk transisi crossfade */
    .slideshow-bg {
      position: fixed;
      inset: 0;
      z-index: -2;

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      opacity: 0;
      transform: scale(1.05);
      transition:
        opacity 1.1s ease-in-out,
        transform 4.5s ease-out;

      will-change: opacity, transform;
    }

    .slideshow-bg.active {
      opacity: 1;
      transform: scale(1);
    }

    /* Overlay gradien lembut agar teks tetap kontras dan mudah dibaca */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      transition: background 0.4s ease;

      background: linear-gradient(
        180deg,
        rgba(26, 38, 30, 0.42) 0%,
        rgba(22, 32, 25, 0.74) 100%
      );
    }

    /* Tombol Dark Mode */
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 10;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      padding: 9px 16px;
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 999px;

      background: rgba(247, 244, 237, 0.88);
      color: #28372d;

      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      user-select: none;

      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.14);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      transition:
        background 0.3s ease,
        color 0.3s ease,
        border-color 0.3s ease,
        transform 0.2s ease;
    }

    .theme-toggle:hover {
      transform: translateY(-2px);
    }

    .theme-toggle:active {
      transform: scale(0.97);
    }

    .theme-toggle:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 4px;
    }

    /* Kartu Cover Undangan */
    .cover-page {
      position: relative;
      width: min(520px, 100%);
      padding: clamp(36px, 7vw, 56px) clamp(24px, 6vw, 44px);

      border: 1px solid rgba(255, 255, 255, 0.48);
      border-radius: 26px;
      background: rgba(247, 244, 237, 0.14);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.22);

      animation: coverEnter 0.85s cubic-bezier(0.22, 1, 0.36, 1) both;
      transition:
        background 0.4s ease,
        border-color 0.4s ease,
        box-shadow 0.4s ease;
    }

    /* Bingkai garis tipis di dalam kartu */
    .cover-page::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 18px;
      pointer-events: none;
      transition: border-color 0.4s ease;
    }

    .cover-page .eyebrow {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.24em;
      color: rgba(255, 255, 255, 0.9);
      margin: 0;
    }

    .cover-page h1.script {
      font-family: var(--font-script);
      font-size: clamp(54px, 13vw, 86px);
      line-height: 1.15;
      font-weight: 400;
      margin: 18px 0 12px;
      color: #ffffff;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.22);
    }

    /* Ornamen garis pembatas */
    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 0 auto 24px;
      width: 140px;
      opacity: 0.75;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: currentColor;
    }

    .divider span {
      font-size: 10px;
      line-height: 1;
    }

    .teks-kepada {
      margin: 0 0 6px;
      font-size: 13px;
      letter-spacing: 0.06em;
      color: rgba(255, 255, 255, 0.85);
    }

    .teks-nama {
      margin: 0 auto 18px;
      font-family: var(--font-serif);
      font-size: clamp(28px, 6.5vw, 36px);
      font-weight: 700;
      line-height: 1.2;
      color: #ffffff;
      word-break: break-word;
    }

    .teks-undangan {
      margin: 0 auto 32px;
      max-width: 38ch;
      font-size: 14.5px;
      line-height: 1.65;
      color: rgba(255, 255, 255, 0.9);
    }

    /* Tombol Buka Undangan */
    .cover-page .btn {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      padding: 14px 28px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      background: #f7f4ed;
      color: #28372d;

      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-decoration: none;
      user-select: none;
      -webkit-touch-callout: none;

      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.18);
      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        background 0.3s ease,
        color 0.3s ease;
    }

    .cover-page .btn:hover {
      transform: translateY(-2px);
      background: #ffffff;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.26);
    }

    .cover-page .btn:active {
      transform: translateY(0) scale(0.98);
    }

    .cover-page .btn svg {
      width: 17px;
      height: 17px;
      transition: transform 0.25s ease;
    }

    .cover-page .btn:hover svg {
      transform: translateX(2px);
    }

    /* =========================================
       TAMPILAN DARK MODE
       ========================================= */
    body.dark-mode::after {
      background: linear-gradient(
        180deg,
        rgba(8, 12, 10, 0.65) 0%,
        rgba(8, 12, 10, 0.86) 100%
      );
    }

    body.dark-mode .cover-page {
      background: rgba(18, 22, 19, 0.68);
      border-color: rgba(232, 214, 168, 0.32);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.48);
    }

    body.dark-mode .cover-page::before {
      border-color: rgba(232, 214, 168, 0.16);
    }

    body.dark-mode .cover-page .eyebrow {
      color: #e2cfa0;
    }

    body.dark-mode .cover-page h1.script {
      color: #fff6df;
    }

    body.dark-mode .divider,
    body.dark-mode .teks-kepada,
    body.dark-mode .teks-undangan {
      color: #e8dec5;
    }

    body.dark-mode .teks-nama {
      color: #f2da9b;
    }

    body.dark-mode .cover-page .btn {
      background: linear-gradient(135deg, #e2cb92 0%, #cfb372 100%);
      color: #1f2620;
      border-color: #f3e3b8;
    }

    body.dark-mode .cover-page .btn:hover {
      background: linear-gradient(135deg, #ebd6a1 0%, #d8bd7e 100%);
    }

    body.dark-mode .theme-toggle {
      background: rgba(28, 34, 29, 0.92);
      color: #f7f4ed;
      border-color: rgba(232, 214, 168, 0.32);
    }

    /* Fokus keyboard yang jelas */
    button:focus:not(:focus-visible),
    a:focus:not(:focus-visible) {
      outline: none;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 2px solid #f0d99b;
      outline-offset: 4px;
    }

    /* Animasi masuk & keluar halaman */
    @keyframes coverEnter {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    body.page-exit .cover-page {
      animation: coverExit 0.45s ease forwards;
    }

    body.page-exit .slideshow-bg {
      opacity: 0 !important;
      transition: opacity 0.45s ease;
    }

    @keyframes coverExit {
      from {
        opacity: 1;
        transform: scale(1);
      }
      to {
        opacity: 0;
        transform: scale(0.96);
      }
    }

    /* Responsif layar HP kecil */
    @media (max-width: 480px) {
      .theme-toggle {
        top: 14px;
        right: 14px;
        padding: 8px 13px;
        font-size: 12px;
      }

      .teks-undangan {
        font-size: 13.5px;
      }
    }

    /* Hormati pengaturan pengurangan animasi perangkat */
    @media (prefers-reduced-motion: reduce) {
      .cover-page,
      .slideshow-bg {
        animation: none;
        transition: opacity 0.2s ease;
        transform: none;
      }

      body.page-exit .cover-page,
      body.page-exit .slideshow-bg {
        animation-duration: 0.01ms;
        transition-duration: 0.01ms;
      }
    }
  </style>
</head>
<body>
  <button
    type="button"
    class="theme-toggle"
    id="themeToggle"
    aria-label="Aktifkan Dark Mode"
    aria-pressed="false"
  >
    <span id="themeIcon" aria-hidden="true">🌙</span>
    <span id="themeLabel">Dark Mode</span>
  </button>

  <main class="cover-page">
    <div class="eyebrow">Undangan Pernikahan</div>
    <h1 class="script">Raka &amp; Sari</h1>

    <div class="divider" aria-hidden="true">
      <span>✦</span>
    </div>

    <p class="teks-kepada">Kepada Yth. Bapak/Ibu/Saudara/i :</p>
    <p class="teks-nama" id="namaTamu">Tamu Undangan</p>

    <p class="teks-undangan">
      Tanpa mengurangi rasa hormat,<br>
      kami mengundang Anda untuk hadir di hari istimewa kami.
    </p>

    <a class="btn" href="undangan.html" id="openInvitation">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="4" width="20" height="16" rx="3"></rect>
        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
      </svg>
      <span>Buka Undangan</span>
    </a>
  </main>

  <script>
    // 1. Ambil nama tamu dari URL parameter (?to=Nama+Tamu)
    (function aturNamaTamu() {
      const params = new URLSearchParams(window.location.search);
      const tamu = params.get("to") || params.get("kepada");
      const elemenNama = document.getElementById("namaTamu");

      if (tamu && tamu.trim() !== "") {
        elemenNama.textContent = tamu.trim();
      }
    })();

    // 2. Slideshow Background dengan Crossfade
    const fotoSlideshow = [
      "https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1800&q=85",
      "https://images.unsplash.com/photo-1519225421980-888cb7f4b8c5?auto=format&fit=crop&w=1800&q=85",
      "https://images.unsplash.com/photo-1465495976277-4387d4b0e4a6?auto=format&fit=crop&w=1800&q=85",
      "https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=1800&q=85",
      "https://images.unsplash.com/photo-1464366400600-7168b8af9bc3?auto=format&fit=crop&w=1800&q=85"
    ];

    const layerA = document.createElement("div");
    const layerB = document.createElement("div");

    layerA.className = "slideshow-bg active";
    layerB.className = "slideshow-bg";
    document.body.prepend(layerA, layerB);

    let fotoAktif = 0;
    let lapisanAktif = layerA;
    let lapisanBerikutnya = layerB;
    let intervalSlideshow = null;

    // Langsung tampilkan foto pertama
    layerA.style.backgroundImage = `url("${fotoSlideshow[0]}")`;

    function muatFoto(url) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(true);
        img.onerror = () => resolve(false);
        img.src = url;
      });
    }

    async function gantiSlideBerikutnya() {
      const indeksBerikutnya = (fotoAktif + 1) % fotoSlideshow.length;
      const urlBerikutnya = fotoSlideshow[indeksBerikutnya];

      await muatFoto(urlBerikutnya);

      lapisanBerikutnya.style.backgroundImage = `url("${urlBerikutnya}")`;
      void lapisanBerikutnya.offsetWidth;

      lapisanBerikutnya.classList.add("active");
      lapisanAktif.classList.remove("active");

      [lapisanAktif, lapisanBerikutnya] = [lapisanBerikutnya, lapisanAktif];
      fotoAktif = indeksBerikutnya;
    }

    function mulaiSlideshow() {
      if (intervalSlideshow) return;
      intervalSlideshow = setInterval(gantiSlideBerikutnya, 4500);
    }

    function hentikanSlideshow() {
      clearInterval(intervalSlideshow);
      intervalSlideshow = null;
    }

    // Jeda slideshow saat tab browser tidak aktif agar hemat baterai
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        hentikanSlideshow();
      } else {
        mulaiSlideshow();
      }
    });

    mulaiSlideshow();

    // 3. Pengaturan Dark Mode & Meta Theme Color
    const tombolTema = document.getElementById("themeToggle");
    const ikonTema = document.getElementById("themeIcon");
    const labelTema = document.getElementById("themeLabel");
    const metaTheme = document.getElementById("metaThemeColor");

    let modeGelap = localStorage.getItem("mode-undangan") === "dark";

    function terapkanTema() {
      document.body.classList.toggle("dark-mode", modeGelap);

      ikonTema.textContent = modeGelap ? "☀️" : "🌙";
      labelTema.textContent = modeGelap ? "Light Mode" : "Dark Mode";

      tombolTema.setAttribute(
        "aria-label",
        modeGelap ? "Aktifkan Light Mode" : "Aktifkan Dark Mode"
      );
      tombolTema.setAttribute("aria-pressed", String(modeGelap));

      if (metaTheme) {
        metaTheme.setAttribute("content", modeGelap ? "#0d120f" : "#28372d");
      }
    }

    terapkanTema();

    tombolTema.addEventListener("click", () => {
      modeGelap = !modeGelap;
      localStorage.setItem("mode-undangan", modeGelap ? "dark" : "light");
      terapkanTema();
    });

    // 4. Transisi Keluar Saat Membuka Undangan
    const tombolBuka = document.getElementById("openInvitation");

    // Teruskan parameter nama tamu (?to=...) ke halaman undangan.html
    if (window.location.search) {
      tombolBuka.href = `undangan.html${window.location.search}`;
    }

    tombolBuka.addEventListener("click", function (event) {
      sessionStorage.setItem("transisiUndangan", "true");

      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        return;
      }

      event.preventDefault();
      document.body.classList.add("page-exit");

      setTimeout(() => {
        window.location.href = tombolBuka.href;
      }, 450);
    });

    // Pulihkan tampilan jika pengguna menekan tombol Back di browser
    window.addEventListener("pageshow", (event) => {
      if (event.persisted) {
        document.body.classList.remove("page-exit");
      }
    });
  </script>
</body>
</html>
